<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario</title>
    <link rel="stylesheet" href="formulario.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

    <div class="card" style="width: 18rem;">
       <img src="Fondo-form.jpg" class="card-img-top" alt="Fondo formulario">
  <div class="card-body">
    <h5 class="card-title">Inicio de sesión</h5>
    <input id="username" type="text" class="form-control" placeholder="Escriba su nombre" aria-label="username"><br>
    <div class="input-group mb-3">
      <input id="password" type="password" class="form-control" placeholder="Escriba su contraseña" aria-label="password">
        <button class="btn btn-outline-secondary" type="button" id="togglePassword" title="Mostrar/ocultar contraseña"><img id="toggleIcon" src="ojo1.png" width="20" alt="ojo"></button>
    </div>
    <div id="form-message" class="mb-2" style="min-height:1.4rem;color:#9d0208;font-weight:600"></div>
    <button id="submitBtn" class="btn btn-primary">Iniciar sesión</button>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="auth.js"></script>
    <script src="formulario.js"></script>
  </body>
</html>
